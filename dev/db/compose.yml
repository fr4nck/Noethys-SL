name: noethys-sl-noe032

services:
  mysql55:
    image: ${NOETHYS_MYSQL55_IMAGE:-mysql:5.5.62@sha256:c9c671d0c959183154313d6830d46f9a00d5937f97415c15ebd3c6844f6f1467}
    platform: linux/amd64
    container_name: noethys-sl-noe032-mysql55
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${NOETHYS_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: noethys_dev
      MYSQL_USER: ${NOETHYS_DB_USER:-noethys}
      MYSQL_PASSWORD: ${NOETHYS_DB_PASSWORD}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - noethys_sl_noe032_mysql55_data:/var/lib/mysql
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  noethys_sl_noe032_mysql55_data:
