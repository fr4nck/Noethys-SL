name: noethys-dev

services:
  mysql55:
    image: ${NOETHYS_MYSQL55_IMAGE:-mysql:5.5.62@sha256:d404d78aa797c87c255e5ae2beb5d8d0e4d095f930b1f20dc208eaa957477b74}
    platform: linux/amd64
    container_name: noethys-mysql55
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NOETHYS_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NOETHYS_DB_NAME:-noethys_dev}
      MYSQL_USER: ${NOETHYS_DB_USER:-noethys}
      MYSQL_PASSWORD: ${NOETHYS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${NOETHYS_DB_PORT:-3308}:3306"
    volumes:
      - noethys_mysql55_data:/var/lib/mysql
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  noethys_mysql55_data:
