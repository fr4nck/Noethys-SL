name: Noethys SL Qt - C19f MySQL transactionnel jetable

# MySQL 5.7 et 8.0 exclusivement dans des conteneurs de GitHub Actions.
# Aucune base PMSL, aucun secret, aucune connexion externe.
on:
  push:
    branches: [qt]
    paths:
      - 'experimental/qt_c19f_mysql_lab/**'
      - 'tests_mysql/test_c19f_mysql_disposable_transactions.py'
      - '.github/workflows/qt-c19f-mysql-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-c19f-mysql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-mysql:
    name: C19f transaction InnoDB sur MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mysql: ['5.7.44', '8.0.40']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: c19f_root_only_disposable_ci
          MYSQL_DATABASE: qt_c19f_lab
          MYSQL_USER: qt_c19f
          MYSQL_PASSWORD: c19f_password_only_disposable_ci
        ports:
          - '33067:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pc19f_root_only_disposable_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=25
    env:
      C19F_DISPOSABLE_MYSQL: 'yes'
      C19F_MYSQL_HOST: '127.0.0.1'
      C19F_MYSQL_PORT: '33067'
      C19F_MYSQL_DATABASE: qt_c19f_lab
      C19F_MYSQL_USER: qt_c19f
      C19F_MYSQL_PASSWORD: c19f_password_only_disposable_ci
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer uniquement le client Python sur le runner
        run: python -m pip install --disable-pip-version-check PyMySQL==1.1.1
      - name: Compiler le labo isole et ses tests
        run: python -m compileall -q experimental/qt_c19f_mysql_lab tests_mysql/test_c19f_mysql_disposable_transactions.py
      - name: Transaction InnoDB, rollback, droits et 2 processus concurrents
        run: >-
          python -m unittest discover
          -s tests_mysql
          -p 'test_c19f_mysql_disposable_transactions.py'
          -v
