name: Noethys SL wx - UI-432K PDF MySQL jetable

# Qualification seule. Jamais de profil utilisateur, envoi ou release.
on:
  push:
    branches: [wx]
    paths:
      - 'noethys/Utils/UTILS_PDF_processus.py'
      - 'noethys/Utils/UTILS_Facturation.py'
      - 'tests/test_ui432k_pdf_mysql.py'
      - '.github/workflows/noethys-sl-ui432k-mysql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recette:
    runs-on: windows-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: ${{ github.workspace }}\\noethys;${{ github.workspace }}\\tests;${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - name: Installer les dependances de recette
        shell: pwsh
        run: |
          Get-Content requirements.txt | Where-Object { $_.Trim() -ne 'pyttsx' } | Set-Content requirements-ui432k-mysql.txt -Encoding UTF8
          python -m pip install -r requirements-ui432k-mysql.txt
          python -m pip install pyttsx3 wxPython==4.2.5
          if ($LASTEXITCODE -ne 0) { throw 'Dependances PDF MySQL indisponibles' }
      - name: Preparer MySQL officiel 5.7.44 a empreinte epinglee
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mysql-5.7.44-winx64.zip'
          Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-5.7/mysql-5.7.44-winx64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'aed661fe8120254a1dc30f5a4d5de346681922f4847cf025e2d4084eca78e70e') {
            throw 'Archive MySQL non conforme'
          }
          $racine = Join-Path $env:RUNNER_TEMP 'ui432k-mysql'
          python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); [z.extract(n,sys.argv[2]) for n in z.namelist() if n.startswith('mysql-5.7.44-winx64/share/') or n in ('mysql-5.7.44-winx64/bin/mysqld.exe','mysql-5.7.44-winx64/bin/mysql.exe') or (n.startswith('mysql-5.7.44-winx64/bin/') and n.lower().endswith('.dll'))]" $zip $racine
          if ($LASTEXITCODE -ne 0) { throw 'Extraction de MySQL impossible' }
      - name: Qualifier Noedoc source sur MySQL local jetable
        shell: pwsh
        env:
          NOETHYS_TEST_MYSQL_HOST: 127.0.0.1
          NOETHYS_TEST_MYSQL_PORT: '3399'
          NOETHYS_TEST_MYSQL_USER: recette
          NOETHYS_TEST_MYSQL_PASSWORD: 'P#w;d "x\\y''z é '
          NOETHYS_TEST_MYSQL_EXIGER: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $racine = Join-Path $env:RUNNER_TEMP 'ui432k-mysql/mysql-5.7.44-winx64'
          $data = Join-Path $env:RUNNER_TEMP 'ui432k-mysql/data'
          & "$racine/bin/mysqld.exe" --no-defaults --initialize-insecure "--basedir=$racine" "--datadir=$data"
          if ($LASTEXITCODE -ne 0) { throw 'Initialisation du MySQL fictif impossible' }
          $serveur = Start-Process -WindowStyle Hidden -FilePath "$racine/bin/mysqld.exe" -PassThru -ArgumentList @(
            '--no-defaults', "--basedir=$racine", "--datadir=$data", '--port=3399',
            '--bind-address=127.0.0.1', '--character-set-server=utf8')
          try {
            python tests/recette_mysql_jetable_preparer.py
            if ($LASTEXITCODE -ne 0) { throw 'Preparation du MySQL fictif impossible' }
            python -m unittest -v tests.test_ui432k_pdf_mysql
            if ($LASTEXITCODE -ne 0) { throw 'Rendu PDF MySQL isole non qualifie' }
          }
          finally {
            Stop-Process -Id $serveur.Id -Force -ErrorAction SilentlyContinue
          }
