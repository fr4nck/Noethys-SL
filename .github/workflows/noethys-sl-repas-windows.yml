name: Noethys SL wx - commandes repas ciblees

# Recette du calcul fournisseur, paniers familiaux et controle tarifaire.
# Aucun envoi fournisseur, facture, ecriture PMSL ou installateur.
on:
  push:
    branches:
      - wx
    paths:
      - 'noethys/Ctrl/CTRL_Commande_repas.py'
      - 'noethys/Dlg/DLG_Commandes.py'
      - 'noethys/Dlg/DLG_Saisie_commande.py'
      - 'noethys/Dlg/DLG_Saisie_commandes_colonne.py'
      - 'noethys/Utils/UTILS_Repas_*.py'
      - 'tests/test_noethys_sl_repas_*.py'
      - 'tests/test_noethys_sl_commandes_*.py'
      - '.github/workflows/noethys-sl-repas-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noethys-sl-wx-repas-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repas:
    name: Commandes fournisseur et paniers - Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}\noethys;${{ github.workspace }}\tests;${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - name: Installer les dependances de tests
        shell: pwsh
        run: |
          Get-Content requirements.txt |
            Where-Object { $_.Trim() -ne 'pyttsx' } |
            Set-Content requirements-noethys-sl-ci.txt -Encoding UTF8
          python -m pip install -r requirements-noethys-sl-ci.txt
          python -m pip install pyttsx3 wxPython==4.2.5
      - name: Recette commandes, repas, fournisseurs et simulation tarifaire
        shell: pwsh
        run: >-
          python -m unittest -v
          tests.test_noethys_sl_commandes_directeur
          tests.test_noethys_sl_commandes_dates_selection
          tests.test_noethys_sl_repas_alimentaires
          tests.test_noethys_sl_repas_source
          tests.test_noethys_sl_repas_totaux
          tests.test_noethys_sl_repas_validation
          tests.test_noethys_sl_repas_validation_dialog
          tests.test_noethys_sl_repas_sqlite_recette
          tests.test_noethys_sl_repas_regimes
          tests.test_noethys_sl_repas_regimes_ui
          tests.test_noethys_sl_repas_questionnaire_setup
          tests.test_noethys_sl_repas_questionnaire_dialog
          tests.test_noethys_sl_repas_regimes_mysql
          tests.test_noethys_sl_repas_regimes_2b
          tests.test_noethys_sl_repas_2c
          tests.test_noethys_sl_repas_2c_wx_integration
          tests.test_noethys_sl_repas_pdf_mail_recette
          tests.test_noethys_sl_repas_tarification_2c
          tests.test_noethys_sl_repas_tarifs_audit_2c
