name: Noethys SL - Assiduite MySQL 5.7 jetable

# Standalone real MySQL 5.7 test, synthetic source only. No release.
on:
  pull_request:
    branches: [wx]
    paths:
      - 'tests/test_stats_assiduite_mysql57.py'
      - 'noethys/Utils/UTILS_Stats_assiduite.py'
      - 'noethys/Utils/UTILS_Stats_assiduite_perimetre.py'
      - 'tests/test_stats_assiduite_perimetre.py'
      - '.github/workflows/noethys-sl-assiduite-mysql57.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assiduite-mysql57:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NOETHYS_TEST_MYSQL_HOST: 127.0.0.1
      NOETHYS_TEST_MYSQL_PORT: '3402'
      NOETHYS_TEST_MYSQL_USER: recette
      NOETHYS_TEST_MYSQL_PASSWORD: 'synthetic-ci-only'
      NOETHYS_ASSIDUITE_MYSQL_EXIGER: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}\noethys;${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install only MySQL test driver
        shell: pwsh
        run: |
          python -m pip install mysqlclient==2.2.7
          if ($LASTEXITCODE -ne 0) { throw 'mysqlclient failed' }
      - name: Verify official MySQL 5.7.44 distribution fingerprint
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mysql-5.7.44-winx64.zip'
          Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-5.7/mysql-5.7.44-winx64.zip' -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'aed661fe8120254a1dc30f5a4d5de346681922f4847cf025e2d4084eca78e70e') {
            throw "MySQL distribution fingerprint mismatch: $hash"
          }
      - name: Compare attendance reader with SQLite, then destroy disposable server
        shell: pwsh
        timeout-minutes: 14
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'mysql57-assiduite'
          $zip = Join-Path $env:RUNNER_TEMP 'mysql-5.7.44-winx64.zip'
          python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); [z.extract(m,sys.argv[2]) for m in z.namelist() if m.startswith('mysql-5.7.44-winx64/share/') or m in ['mysql-5.7.44-winx64/bin/mysqld.exe','mysql-5.7.44-winx64/bin/mysql.exe','mysql-5.7.44-winx64/bin/mysqldump.exe'] or (m.startswith('mysql-5.7.44-winx64/bin/') and m.lower().endswith('.dll'))]" $zip $base
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          $root = Join-Path $base 'mysql-5.7.44-winx64'
          $data = Join-Path $base 'data'
          & "$root/bin/mysqld.exe" --no-defaults --initialize-insecure "--basedir=$root" "--datadir=$data"
          if ($LASTEXITCODE -ne 0) { throw 'MySQL initialization failed' }
          $server = Start-Process -WindowStyle Hidden -FilePath "$root/bin/mysqld.exe" -PassThru -ArgumentList @(
            '--no-defaults', "--basedir=$root", "--datadir=$data", '--port=3402',
            '--bind-address=127.0.0.1', '--character-set-server=utf8mb4')
          try {
            python tests/recette_mysql_jetable_preparer.py
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic MySQL user provisioning failed' }
            python -m unittest -v tests.test_stats_assiduite_mysql57
            if ($LASTEXITCODE -ne 0) { throw 'MySQL attendance parity FAIL' }
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
