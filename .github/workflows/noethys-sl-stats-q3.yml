name: Noethys SL wx - STATS-Q3 VFS natif cible

on:
  push:
    branches:
      - wx
    paths:
      - 'tests/test_stats_restore_vfs_win32.py'
      - 'tests/test_stats_restore_vfs_shutdown_win32.py'
      - '.github/workflows/noethys-sl-stats-q3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vfs-win:
    name: STATS-Q3 - isoler cycle de vie MemoryFS sur Windows
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Installer wxPython natif
        run: python -m pip install wxPython==4.2.5
      - name: Diagnostiquer les cinq scenarios de fermeture
        if: always()
        run: python -m unittest -v tests.test_stats_restore_vfs_shutdown_win32
      - name: Verifier les 100 actualisations et 100 ouvertures
        if: always()
        run: python -m unittest -v tests.test_stats_restore_vfs_win32
