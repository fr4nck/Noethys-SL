name: Noethys SL - FACT-COT MySQL 5.7 isole

# Essai MySQL reel a chaque changement de cette recette, et sur demande.
# Ne contacte jamais de base de production. Donnees et identifiants synthetiques.
on:
  push:
    branches: [main, wx, qt]
    paths:
      - 'tests/test_noethys_sl_facturation_cotisations_mysql.py'
      - '.github/workflows/noethys-sl-fact-cot-mysql57.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fact-cot-mysql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql57-facturation:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NOETHYS_TEST_MYSQL_HOST: 127.0.0.1
      NOETHYS_TEST_MYSQL_PORT: '3401'
      NOETHYS_TEST_MYSQL_USER: recette
      NOETHYS_TEST_MYSQL_PASSWORD: 'P#w;d "x\y''z é '
      NOETHYS_TEST_MYSQL_EXIGER: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}\noethys;${{ github.workspace }}\tests;${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - name: Installer les dependances
        shell: pwsh
        run: |
          Get-Content requirements.txt |
            Where-Object { $_.Trim() -ne 'pyttsx' } |
            Set-Content requirements-noethys-sl-ci.txt -Encoding UTF8
          python -m pip install -r requirements-noethys-sl-ci.txt
          python -m pip install pyttsx3 wxPython==4.2.5

      - name: Verifier MySQL 5.7.44 officiel
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mysql-5.7.44-winx64.zip'
          Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-5.7/mysql-5.7.44-winx64.zip' -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'aed661fe8120254a1dc30f5a4d5de346681922f4847cf025e2d4084eca78e70e') {
            throw "Empreinte inattendue de MySQL : $hash"
          }

      - name: Installer et qualifier la base jetable
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'mysql57-fact-cot'
          $zip = Join-Path $env:RUNNER_TEMP 'mysql-5.7.44-winx64.zip'
          python -c "import sys, zipfile; z=zipfile.ZipFile(sys.argv[1]); [z.extract(m, sys.argv[2]) for m in z.namelist() if m.startswith('mysql-5.7.44-winx64/share/') or m in ['mysql-5.7.44-winx64/bin/mysqld.exe','mysql-5.7.44-winx64/bin/mysql.exe','mysql-5.7.44-winx64/bin/mysqldump.exe'] or (m.startswith('mysql-5.7.44-winx64/bin/') and m.lower().endswith('.dll'))]" $zip $base
          if ($LASTEXITCODE -ne 0) { throw 'Extraction MySQL echouee' }
          $root = Join-Path $base 'mysql-5.7.44-winx64'
          $data = Join-Path $base 'data'
          $env:NOETHYS_TEST_MYSQL_BIN = Join-Path $root 'bin'
          & "$root/bin/mysqld.exe" --no-defaults --initialize-insecure "--basedir=$root" "--datadir=$data"
          if ($LASTEXITCODE -ne 0) { throw 'Initialisation MySQL jetable echouee' }
          $server = Start-Process -WindowStyle Hidden -FilePath "$root/bin/mysqld.exe" -PassThru -ArgumentList @(
            '--no-defaults', "--basedir=$root", "--datadir=$data", '--port=3401',
            '--bind-address=127.0.0.1', '--character-set-server=utf8')
          try {
            python tests/recette_mysql_jetable_preparer.py
            if ($LASTEXITCODE -ne 0) { throw 'Compte de recette MySQL non initialise' }
            python -m unittest -v tests.test_noethys_sl_facturation_cotisations_mysql
            if ($LASTEXITCODE -ne 0) { throw 'Recette FACT-COT MySQL en echec' }
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
