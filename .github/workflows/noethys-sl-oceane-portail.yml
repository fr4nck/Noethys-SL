name: Noethys SL wx - menus Oceane portail (isole)

on:
  push:
    branches: [wx]
    paths:
      - 'noethys/Utils/UTILS_Oceane_xlsx.py'
      - 'noethys/Utils/UTILS_Repas_oceane*.py'
      - 'noethys/Dlg/DLG_Menus.py'
      - 'noethys/Dlg/DLG_Repas_Oceane.py'
      - 'tests/test_noethys_sl_oceane_portail.py'
      - 'tests/test_noethys_sl_repas_oceane*.py'
      - '.github/workflows/noethys-sl-oceane-portail.yml'
  workflow_dispatch:

permissions:
  contents: read

# Aucun packaging ni déploiement. Pas de cancel-in-progress :
# la qualification garde son SHA malgré les commits d'autres chantiers.
jobs:
  pure-contracts:
    name: XLSX et portail, source fictive (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}/noethys:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Syntaxe des modules Océane
        run: python -m compileall -q noethys/Utils/UTILS_Oceane_xlsx.py noethys/Utils/UTILS_Repas_oceane.py noethys/Utils/UTILS_Repas_oceane_export.py noethys/Utils/UTILS_Repas_oceane_menus.py noethys/Utils/UTILS_Repas_oceane_annexe.py noethys/Utils/UTILS_Repas_oceane_restes.py noethys/Utils/UTILS_Repas_oceane_publication.py noethys/Utils/UTILS_Repas_oceane_import_db.py noethys/Dlg/DLG_Menus.py noethys/Dlg/DLG_Repas_Oceane.py
      - name: Unités métier, import/export exact XLSX et publication
        run: >-
          python -m unittest -v
          tests.test_noethys_sl_repas_oceane
          tests.test_noethys_sl_repas_oceane_export
          tests.test_noethys_sl_repas_oceane_restes
          tests.test_noethys_sl_oceane_portail

  windows-interface:
    name: Ecrans menus/portail wxPython (Windows)
    runs-on: windows-latest
    needs: pure-contracts
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}\\noethys;${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - name: Installer les dependances de Noethys-SL
        shell: pwsh
        run: |
          Get-Content requirements.txt |
            Where-Object { $_.Trim() -ne 'pyttsx' } |
            Set-Content requirements-noethys-sl-ci.txt -Encoding UTF8
          python -m pip install -r requirements-noethys-sl-ci.txt
          python -m pip install pyttsx3 wxPython==4.2.5
      - name: Charger les deux ecrans reels et leurs composants
        shell: pwsh
        run: |
          python -c "from Dlg import DLG_Menus, DLG_Repas_Oceane, DLG_Saisie_portail_bloc; from Ctrl import CTRL_Editeur_email; assert hasattr(DLG_Menus.Dialog, 'OnImporterOceane'); assert hasattr(DLG_Menus.Dialog, '_PreparerPublicationOceane'); assert hasattr(DLG_Repas_Oceane, 'DialogExport'); assert hasattr(CTRL_Editeur_email, 'Editeur'); print('GUI_OCEANE_IMPORT=PASS')"
      - name: Rejouer les tests de publication sous Windows
        run: >-
          python -m unittest -v
          tests.test_noethys_sl_oceane_portail
          tests.test_noethys_sl_repas_oceane
          tests.test_noethys_sl_repas_oceane_export
          tests.test_noethys_sl_repas_oceane_restes
