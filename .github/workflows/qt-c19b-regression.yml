name: Noethys SL Qt - C19b a C19e recette ciblee

on:
  push:
    branches:
      - qt
    paths:
      - 'noethys_qt/noethys_native.py'
      - 'noethys_qt/consumptions_calendar_ui.py'
      - 'noethys_qt/catalog_readonly_ui.py'
      - 'noethys_qt/c19b_operational_guard.py'
      - 'tests_qt/test_c19b_inscription_consumption_invoices.py'
      - 'tests_qt/test_c19b_operational_guard.py'
      - 'noethys_qt/billing_preflight_core.py'
      - 'noethys_qt/billing_preflight_ui.py'
      - 'tests_qt/test_c19c_billing_preflight_core.py'
      - 'tests_qt/test_c19c_billing_preflight_qt.py'
      - 'noethys_qt/legacy_write_barrier.py'
      - 'tests_qt/test_c19d_legacy_write_barrier.py'
      - 'noethys_qt/invoice_scope_contract.py'
      - 'noethys_qt/invoice_scope_fixture_repo.py'
      - 'tests_qt/test_c19e_invoice_scope_contract.py'
      - 'tests_qt/test_c19e_invoice_scope_fixture_repo.py'
      - 'tests_qt/test_c19e_inmemory_transaction_oracle.py'
      - 'tests_qt/test_ci_sharding.py'
      - 'tests_qt/test_c19_financial_organisation_registries.py'
      - 'tests_qt/test_native_c12_shell_routes.py'
      - '.github/workflows/qt-c19b-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-c19b-cible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-c19b:
    name: Windows - C19b a C19e, controle et transaction fictive
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer PySide6 uniquement sur le runner de CI
        run: python -m pip install -r requirements-qt.txt
      - name: Compiler les modules Qt et les contrats
        run: python -m compileall -q noethys_qt tests_qt
      - name: 'Recette du parcours fictif et des quatre regressions'
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\tests_qt;$env:GITHUB_WORKSPACE"
          python -m unittest -v `
            test_c19b_inscription_consumption_invoices `
            test_c19b_operational_guard `
            test_c19c_billing_preflight_core `
            test_c19c_billing_preflight_qt `
            test_c19d_legacy_write_barrier `
            test_c19e_invoice_scope_contract `
            test_c19e_invoice_scope_fixture_repo `
            test_c19e_inmemory_transaction_oracle `
            test_ci_sharding.QtCiShardingContractTests.test_three_heavy_modules_have_distinct_shards `
            test_c19_financial_organisation_registries.C19SqlContractTests.test_bank_sensitive_identifiers_are_never_fetched_or_displayed `
            test_c19_financial_organisation_registries.C19QtModulesTests.test_budget_context_does_not_leak_when_menu_reopened `
            test_native_c12_shell_routes.C12NativeShellTests.test_inscription_resolves_source_keys_not_displayed_name
