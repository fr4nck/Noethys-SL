name: Qt prototype — Noethys

on:
  workflow_dispatch:
  push:
    branches:
      - qt
    paths:
      - "noethys_qt/**"
      - "tests_qt/**"
      - "requirements-qt.txt"
      - ".github/workflows/qt-prototype.yml"

permissions:
  contents: read

jobs:
  windows-qt-smoke:
    name: Windows / PySide6 / smoke
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qt.txt

      - name: Compiler le rail Qt
        run: python -m compileall -q noethys_qt tests_qt

      - name: Tests Qt hors écran
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests_qt -p "test_*.py" -v

      - name: Capture Qt fictive - echelle 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c6_visual_capture.py --output artifacts/qt-c6/scale100.png

      - name: Capture Qt fictive - echelle 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c6_visual_capture.py --output artifacts/qt-c6/scale150.png

      - name: Publier captures visuelles synthetiques Qt
        uses: actions/upload-artifact@v4
        with:
          name: qt-c6-captures-fictives
          path: artifacts/qt-c6/*.png
          if-no-files-found: error
          retention-days: 14

      - name: C7 interactions Qt fictives - 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c7_interaction_trace.py --profile 100

      - name: C7 interactions Qt fictives - 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c7_interaction_trace.py --profile 150

      - name: Publier captures et mesures d'interactions C7
        uses: actions/upload-artifact@v4
        with:
          name: qt-c7-interactions-fictives
          path: artifacts/qt-c7/*
          if-no-files-found: error
          retention-days: 14
