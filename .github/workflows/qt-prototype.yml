name: Qt prototype — Noethys

on:
  workflow_dispatch:
  push:
    branches:
      - qt
    paths:
      - "noethys_qt/**"
      - "tests_qt/**"
      - "tools/qt_c*.py"
      - "tools/qt_ci_test_runner.py"
      - "requirements-qt.txt"
      - ".github/workflows/qt-prototype.yml"

permissions:
  contents: read

# Une exécution courante par branche ; aucun run protégé ou release affecté.
concurrency:
  group: noethys-qt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-qt-tests:
    name: Windows / tests Qt shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qt.txt

      - name: Compiler le rail Qt
        run: python -m compileall -q noethys_qt tests_qt tools/qt_ci_test_runner.py

      - name: Suite de tests Qt fictifs complete - partition deterministe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tools.qt_ci_test_runner --shard ${{ matrix.shard }} --shards 3

  windows-qt-smoke:
    name: Windows / PySide6 / smoke
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qt.txt

      - name: Compiler le rail Qt
        run: python -m compileall -q noethys_qt tests_qt tools/qt_ci_test_runner.py

      - name: Capture Qt fictive - echelle 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c6_visual_capture.py --output artifacts/qt-c6/scale100.png

      - name: Capture Qt fictive - echelle 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c6_visual_capture.py --output artifacts/qt-c6/scale150.png

      - name: Publier captures visuelles synthetiques Qt
        uses: actions/upload-artifact@v4
        with:
          name: qt-c6-captures-fictives
          path: artifacts/qt-c6/*.png
          if-no-files-found: error
          retention-days: 14

      - name: C7 interactions Qt fictives - 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c7_interaction_trace.py --profile 100

      - name: C7 interactions Qt fictives - 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c7_interaction_trace.py --profile 150

      - name: Publier captures et mesures d'interactions C7
        uses: actions/upload-artifact@v4
        with:
          name: qt-c7-interactions-fictives
          path: artifacts/qt-c7/*
          if-no-files-found: error
          retention-days: 14

      - name: C8 démonstration - clair 100% - 1024 pixels
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/qt_c8_windows_demo.py --smoke --scale 1 --theme light --label light-100

      - name: C8 démonstration - sombre 125% - 1100 pixels
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/qt_c8_windows_demo.py --smoke --scale 1.25 --theme dark --label dark-125

      - name: C8 démonstration - clair 150% - 1280 pixels
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/qt_c8_windows_demo.py --smoke --scale 1.5 --theme light --label light-150

      - name: C8 démonstration - sombre 150% - 1100 pixels
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/qt_c8_windows_demo.py --smoke --scale 1.5 --theme dark --label dark-150

      - name: Archiver les captures de démonstration C8
        uses: actions/upload-artifact@v4
        with:
          name: qt-c8-recette-fictive
          path: artifacts/qt-c8/*
          if-no-files-found: error
          retention-days: 14

      - name: C10 fiches metier fictives - theme clair 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c10_business_capture.py --theme light --profile 100

      - name: C10 fiches metier fictives - theme sombre 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c10_business_capture.py --theme dark --profile 150

      - name: Publier les fiches metier fictives C10
        uses: actions/upload-artifact@v4
        with:
          name: qt-c10-fiches-fictives
          path: artifacts/qt-c10/*
          if-no-files-found: error
          retention-days: 14

      - name: C11 contexte exact - clair 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c11_context_capture.py --theme light --profile 100

      - name: C11 contexte exact - sombre 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c11_context_capture.py --theme dark --profile 150

      - name: Publier les captures de liaison C11
        uses: actions/upload-artifact@v4
        with:
          name: qt-c11-parcours-exacts-fictifs
          path: artifacts/qt-c11/*
          if-no-files-found: error
          retention-days: 14

      - name: C12 coque native fictive - clair 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c12_native_shell_demo.py --smoke --theme light --profile 100

      - name: C12 coque native fictive - sombre 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c12_native_shell_demo.py --smoke --theme dark --profile 150

      - name: Publier les captures de la vraie coque Qt C12
        uses: actions/upload-artifact@v4
        with:
          name: qt-c12-coque-native-fictive
          path: artifacts/qt-c12/*
          if-no-files-found: error
          retention-days: 14

      - name: C13 finances fictives sur coque native - clair 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c13_native_finance_demo.py --smoke --theme light --profile 100

      - name: C13 finances fictives sur coque native - sombre 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c13_native_finance_demo.py --smoke --theme dark --profile 150

      - name: Publier les captures des modules financiers Qt C13
        uses: actions/upload-artifact@v4
        with:
          name: qt-c13-finances-fictives
          path: artifacts/qt-c13/*
          if-no-files-found: error
          retention-days: 14

      - name: C14 catalogues fictifs sur coque native - clair 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c14_native_catalog_demo.py --smoke --theme light --profile 100

      - name: C14 catalogues fictifs sur coque native - sombre 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c14_native_catalog_demo.py --smoke --theme dark --profile 150

      - name: Publier les captures des modules administratifs Qt C14
        uses: actions/upload-artifact@v4
        with:
          name: qt-c14-catalogues-fictifs
          path: artifacts/qt-c14/*
          if-no-files-found: error
          retention-days: 14

      - name: C15 modules fictifs sur coque native - clair 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c15_native_modules_demo.py --smoke --theme light --profile 100

      - name: C15 modules fictifs sur coque native - sombre 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c15_native_modules_demo.py --smoke --theme dark --profile 150

      - name: Publier les captures des nouveaux modules Qt C15
        uses: actions/upload-artifact@v4
        with:
          name: qt-c15-modules-fictifs
          path: artifacts/qt-c15/*
          if-no-files-found: error
          retention-days: 14

      - name: C16 planning et etats fictifs sur coque native - clair 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c16_native_demo.py --smoke --theme light --profile 100

      - name: C16 planning et etats fictifs sur coque native - sombre 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c16_native_demo.py --smoke --theme dark --profile 150

      - name: Publier les captures fictives des modules Qt C16
        uses: actions/upload-artifact@v4
        with:
          name: qt-c16-planning-etats-fictifs
          path: artifacts/qt-c16/*
          if-no-files-found: error
          retention-days: 14

      - name: C17 - moteur commun sans dependances UI (12 tests)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_noethys_sl_consumption_states_shared

      - name: C17 cockpit activites fictives - clair 100%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python tools/qt_c17_native_demo.py --smoke --theme light --profile 100

      - name: C17 cockpit activites fictives - sombre 150%
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.5"
        run: python tools/qt_c17_native_demo.py --smoke --theme dark --profile 150

      - name: Publier les captures fictives de suivi Qt C17
        uses: actions/upload-artifact@v4
        with:
          name: qt-c17-suivi-activites-fictifs
          path: artifacts/qt-c17/*
          if-no-files-found: error
          retention-days: 14
