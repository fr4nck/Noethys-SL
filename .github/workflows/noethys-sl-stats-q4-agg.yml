name: Noethys SL wx - Q4 graphes Matplotlib Agg natif

# Seulement les methodes MAJ de 15 graphes, sur SQLite en memoire.
# Aucun profil, aucun reseau de distances, aucune BDD reelle, aucun wx.
on:
  push:
    branches: [wx]
    paths:
      - 'tests/test_stats_q4_matplotlib_agg.py'
      - '.github/workflows/noethys-sl-stats-q4-agg.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q4-agg-${{ github.sha }}
  cancel-in-progress: false

jobs:
  agg-linux:
    name: Q4-C1 - 15 PNG reels via Matplotlib Agg Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOETHYS_STATS_Q4_AGG: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Installer seulement les dependances du banc
        run: python -m pip install numpy matplotlib Pillow
      - name: Compiler le banc
        run: python -m py_compile tests/test_stats_q4_matplotlib_agg.py
      - name: Dessiner et verifier les 15 graphes du moteur en PNG
        run: python -m unittest -v tests.test_stats_q4_matplotlib_agg

  agg-windows:
    name: Q4-C1 - 15 PNG reels via Matplotlib Agg Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NOETHYS_STATS_Q4_AGG: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Installer seulement les dependances du banc
        run: python -m pip install numpy matplotlib Pillow
      - name: Compiler le banc
        run: python -m py_compile tests/test_stats_q4_matplotlib_agg.py
      - name: Dessiner et verifier les 15 graphes du moteur en PNG
        run: python -m unittest -v tests.test_stats_q4_matplotlib_agg
