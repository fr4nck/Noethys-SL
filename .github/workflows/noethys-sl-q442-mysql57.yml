name: Noethys SL Q442 - MySQL 5.7 jetable (J6)

# Dedicated QF cross-database verification. No build, tag, or release.
# A real localhost MySQL 5.7 instance is created from the official pinned
# archive. All rows are synthetic; all QF production-reader calls are SELECT.
on:
  pull_request:
    branches: [wx]
    paths:
      - 'tests/test_q442_j6_mysql57.py'
      - 'noethys/Utils/UTILS_Stats_qf_lecture.py'
      - 'noethys/Utils/UTILS_Stats_qf_sites.py'
      - '.github/workflows/noethys-sl-q442-mysql57.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q442-mysql57-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mysql57-q442:
    name: J6 - vrais SELECT QF sur MySQL 5.7 local jetable
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NOETHYS_TEST_MYSQL_HOST: 127.0.0.1
      NOETHYS_TEST_MYSQL_PORT: '3402'
      NOETHYS_TEST_MYSQL_USER: recette
      NOETHYS_TEST_MYSQL_PASSWORD: 'P#w;d "x\y''z é '
      NOETHYS_Q442_MYSQL_EXIGER: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}\noethys;${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Installer uniquement le pilote MySQL de recette
        shell: pwsh
        run: |
          python -m pip install mysqlclient==2.2.7
          if ($LASTEXITCODE -ne 0) { throw 'mysqlclient indisponible' }

      - name: Verifier archive officielle MySQL 5.7.44 SHA-256
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mysql-5.7.44-winx64.zip'
          Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-5.7/mysql-5.7.44-winx64.zip' -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'aed661fe8120254a1dc30f5a4d5de346681922f4847cf025e2d4084eca78e70e') {
            throw "MySQL archive fingerprint mismatch: $hash"
          }

      - name: Executer J6 contre MySQL 5.7 reel et detruire le serveur jetable
        shell: pwsh
        timeout-minutes: 14
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'mysql57-q442-j6'
          $zip = Join-Path $env:RUNNER_TEMP 'mysql-5.7.44-winx64.zip'
          python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); [z.extract(m,sys.argv[2]) for m in z.namelist() if m.startswith('mysql-5.7.44-winx64/share/') or m in ['mysql-5.7.44-winx64/bin/mysqld.exe','mysql-5.7.44-winx64/bin/mysql.exe','mysql-5.7.44-winx64/bin/mysqldump.exe'] or (m.startswith('mysql-5.7.44-winx64/bin/') and m.lower().endswith('.dll'))]" $zip $base
          if ($LASTEXITCODE -ne 0) { throw 'MySQL extraction failed' }
          $root = Join-Path $base 'mysql-5.7.44-winx64'
          $data = Join-Path $base 'data'
          & "$root/bin/mysqld.exe" --no-defaults --initialize-insecure "--basedir=$root" "--datadir=$data"
          if ($LASTEXITCODE -ne 0) { throw 'MySQL initialization failed' }
          $server = Start-Process -WindowStyle Hidden -FilePath "$root/bin/mysqld.exe" -PassThru -ArgumentList @(
            '--no-defaults', "--basedir=$root", "--datadir=$data", '--port=3402',
            '--bind-address=127.0.0.1', '--character-set-server=utf8mb4')
          try {
            python tests/recette_mysql_jetable_preparer.py
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic MySQL account setup failed' }
            python -m unittest -v tests.test_q442_j6_mysql57
            if ($LASTEXITCODE -ne 0) { throw 'Q442 J6 MySQL 5.7 cross-engine tests failed' }
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
