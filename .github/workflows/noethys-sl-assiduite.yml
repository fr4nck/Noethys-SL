name: Noethys SL - Statistiques assiduite (candidat)

# Read-only and synthetic. Does not access any association database.
on:
  push:
    branches:
      - stats/assiduite-candidat
    paths:
      - 'noethys/Utils/UTILS_Stats_assiduite*.py'
      - 'tests/test_stats_assiduite*.py'
      - '.github/workflows/noethys-sl-assiduite.yml'
  pull_request:
    branches: [wx]
    paths:
      - 'noethys/Utils/UTILS_Stats_assiduite*.py'
      - 'tests/test_stats_assiduite*.py'
      - '.github/workflows/noethys-sl-assiduite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-and-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install only isolated test dependencies
        run: python -m pip install matplotlib xlsxwriter
      - name: Syntax and strict synthetic tests
        run: |
          python -m compileall -q noethys/Utils/UTILS_Stats_assiduite.py noethys/Utils/UTILS_Stats_assiduite_exports.py noethys/Utils/UTILS_Stats_assiduite_objets.py tests/test_stats_assiduite_synthetic.py tests/test_stats_assiduite_exports.py tests/test_stats_assiduite_objets.py tests/test_stats_assiduite_ui_contract.py
          python -m unittest -v tests.test_stats_assiduite_synthetic tests.test_stats_assiduite_exports tests.test_stats_assiduite_objets tests.test_stats_assiduite_ui_contract

  wx-real-statistics:
    needs: sqlite-and-exports
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}\noethys;${{ github.workspace }}\tests;${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - name: Install existing Noethys wx test dependencies
        shell: pwsh
        run: |
          Get-Content requirements.txt |
            Where-Object { $_.Trim() -ne 'pyttsx' } |
            Set-Content requirements-noethys-sl-ci.txt -Encoding UTF8
          python -m pip install -r requirements-noethys-sl-ci.txt
          python -m pip install pyttsx3 wxPython==4.2.5
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies unavailable' }
      - name: Real wx Dialog, HTML/VFS and printing markup (synthetic DB)
        shell: pwsh
        run: |
          python -m unittest -v tests.test_stats_assiduite_win32
          if ($LASTEXITCODE -ne 0) { throw 'Attendance wx integration FAIL' }
