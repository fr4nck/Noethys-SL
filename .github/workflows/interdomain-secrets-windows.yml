name: Secrets inter-domaines Windows

on:
  push:
    branches: [main, wx]
    paths:
      - 'noethys/Utils/UTILS_Interdomain_Secrets.py'
      - 'noethys/Utils/UTILS_Interdomain_Mailbox_Client.py'
      - 'tests/test_noethys_sl_interdomain_secrets.py'
      - 'tests/test_noethys_sl_interdomain_mailbox_client.py'
      - '.github/workflows/interdomain-secrets-windows.yml'
  pull_request:
    branches: [main, wx]
    paths:
      - 'noethys/Utils/UTILS_Interdomain_Secrets.py'
      - 'noethys/Utils/UTILS_Interdomain_Mailbox_Client.py'
      - 'tests/test_noethys_sl_interdomain_secrets.py'
      - 'tests/test_noethys_sl_interdomain_mailbox_client.py'
      - '.github/workflows/interdomain-secrets-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-manager:
    name: Windows Credential Manager
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Compiler provider et client
        shell: pwsh
        run: |
          python -m py_compile noethys/Utils/UTILS_Interdomain_Secrets.py
          python -m py_compile noethys/Utils/UTILS_Interdomain_Mailbox_Client.py

      - name: Qualifier coffre réel et orchestration sans réseau
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\noethys;${{ github.workspace }}\tests;${{ github.workspace }}
        run: >-
          python -m unittest -v
          tests.test_noethys_sl_interdomain_secrets
          tests.test_noethys_sl_interdomain_mailbox_client
